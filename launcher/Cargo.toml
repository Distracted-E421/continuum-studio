[package]
name = "synapsix-launcher"
version = "0.1.0"
edition = "2021"
authors = ["e421"]
description = "Synapsix Launcher - Quick start tool for Cursor with Synapsix integration"
license = "SSPL-1.0"
rust-version = "1.80"

[[bin]]
name = "synapsix-launcher"
path = "src/main.rs"

[dependencies]
# Shared COSMIC theme system
synapsix-theme = { path = "../crates/synapsix-theme", features = ["iced"] }

# iced GUI framework
iced = { version = "0.14", features = [
    "tokio",
    "image",
    "svg",
    "advanced",
] }

# Async runtime
tokio = { version = "1.0", features = [
    "rt-multi-thread",
    "sync",
    "macros",
    "net",
    "io-util",
    "time",
    "fs",
    "process",
] }
futures = "0.3"

# D-Bus integration for Synapsix daemon
zbus = { version = "4.4", default-features = false, features = ["tokio"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# File system
dirs = "5.0"

# HTTP client for Synapsix API
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Logging
log = "0.4"
env_logger = "0.11"

# System theme detection
dark-light = "2.0"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Date/time for version info
chrono = { version = "0.4", features = ["serde"] }
