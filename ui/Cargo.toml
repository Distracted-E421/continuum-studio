[package]
name = "continuum-studio-ui"
version = "0.1.0"
edition = "2021"
authors = ["e421"]
description = "Continuum Studio UI - Modular AI orchestration interface"
license = "AGPL-3.0"
rust-version = "1.75"

[dependencies]
# GUI - egui with eframe (native + Wayland support)
eframe = { version = "0.29", default-features = false, features = [
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }
egui = "0.29"
egui_extras = { version = "0.29", features = ["all_loaders"] }

# Async runtime
tokio = { version = "1.0", features = [
    "rt",
    "rt-multi-thread",
    "sync",
    "macros",
    "net",
    "io-util",
    "time",
    "signal",
] }
futures = "0.3"

# D-Bus integration for dialog daemon
zbus = { version = "4.4", default-features = false, features = ["tokio"] }

# IPC - ETF encoding for Elixir communication
# Note: Using JSON as placeholder until erlang_term is properly integrated
# Future: erlang_term = "2.0" for proper ETF

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# ETF encoding for Elixir/Erlang communication
erlang_rs = "2.0"

# File system
dirs = "5.0"

# Utilities
chrono = { version = "0.4", features = ["serde"] }
toml = "0.8"
uuid = { version = "1.8", features = ["v4", "serde"] }
thiserror = "1.0"
anyhow = "1.0"
log = "0.4"
env_logger = "0.11"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Image loading for icons
image = { version = "0.25", default-features = false, features = ["png"] }

[[bin]]
name = "continuum-studio"
path = "src/main.rs"

[[bin]]
name = "test-harness"
path = "src/bin/test-harness.rs"

[lib]
name = "continuum_studio_ui"
path = "src/lib.rs"

# ============================================
# Build Profiles
# ============================================

[profile.dev]
opt-level = 1
debug = 1
incremental = true

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true

